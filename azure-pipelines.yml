trigger:
  branches:
    include:
      - main

parameters:
  - name: runDbMigrations
    type: boolean
    default: false

variables:
  - group: StaticWebAppTokens
  - group: DBSecrets
  - name: RUN_DB_MIGRATIONS
    value: ${{ parameters.runDbMigrations }}

pool:
  name: Pauli   

stages:
  - stage: Build
    displayName: "Build and Test"
    jobs:
      - job: Frontend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'

          - script: |
              cd frontend
              echo "📂 Archivos JSON en frontend:"
              dir *.json
            displayName: "Debug - Listar JSON (Windows)"
            condition: always()

          - script: |
              cd frontend
              echo "🚀 Ejecutando build de React..."
              npm ci
              npm run build || exit 1

              echo "📂 Contenido de frontend tras build:"
              dir

              echo "📂 Buscando recursivamente la carpeta build:"
              dir /s build
            displayName: "Build React App (con debug extendido)"

          - script: |
              cd frontend
              npm ci
              set JEST_JUNIT_OUTPUT=./test-results/frontend-junit.xml
              mkdir test-results || exit 0
              npm run test:ci
            displayName: "Run Frontend Unit Tests (CI reporter)"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.SourcesDirectory)/frontend/build
              artifact: drop-front

      - job: Backend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'

          - script: |
              cd backend
              npm ci 
            displayName: "Instalar dependencias de producción Backend"

          - script: |
              cd backend
              npm ci
              set JEST_JUNIT_OUTPUT=./test-results/backend-junit.xml
              mkdir test-results || exit 0
              npm run test:ci
            displayName: "Run Backend Tests (CI reporter)"

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/*.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              failTaskOnFailedTests: true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.SourcesDirectory)/backend
              artifact: drop-back

  # -------------------------------
  # Deploy QA
  # -------------------------------
  - stage: Deploy_QA
    displayName: "Deploy to QA"
    dependsOn: Build
    jobs:
      - deployment: DeployQA
        displayName: "Desplegar QA"
        environment: "QA"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop-front
                - download: current
                  artifact: drop-back

                - script: |
                    echo "Preparing backend for deploy (installing production deps)..."
                    cd "$(Pipeline.Workspace)/drop-back"
                    if exist package.json (
                      npm ci --only=production
                    ) else (
                      echo "No package.json found in drop-back"
                    )
                  displayName: "Prepare backend (npm ci)"

                - task: ArchiveFiles@2
                  displayName: "Empaquetar Backend (QA)"
                  inputs:
                    rootFolderOrFile: '$(Pipeline.Workspace)/drop-back'
                    includeRootFolder: false
                    archiveFile: '$(Pipeline.Workspace)/drop-back.zip'
                    replaceExistingArchive: true

                - task: AzureWebApp@1
                  displayName: "Deploy Backend QA"
                  inputs:
                    azureSubscription: "azure-connection-tp06"
                    appName: "tp05-backend-qa"
                    package: "$(Pipeline.Workspace)/drop-back.zip"
                # Debug: comprobar que las variables DB_* llegaron al agente (NO imprime el secreto)
                - task: PowerShell@2
                  displayName: 'Debug - Check DB env presence (no secret shown)'
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "DBG: DB_HOST = $env:DB_HOST"
                      Write-Host "DBG: DB_USER = $env:DB_USER"
                      if ($env:DB_PASSWORD) { Write-Host "DBG: DB_PASSWORD is SET" } else { Write-Host "DBG: DB_PASSWORD is NOT SET" }
                      Write-Host "DBG: DB_NAME = $env:DB_NAME"
                      Write-Host "DBG: DB_PORT = $env:DB_PORT"

                # Opcional: ejecutar migraciones (aplicar índice UNIQUE). Controlado por variable RUN_DB_MIGRATIONS
                - task: PowerShell@2
                  displayName: "(Opt) Run DB migrations"
                  inputs:
                    targetType: 'inline'
                    script: |
                      Write-Host "RUN_DB_MIGRATIONS=$(RUN_DB_MIGRATIONS)"
                      if ("$(RUN_DB_MIGRATIONS)" -eq "true") {
                        Write-Host "Running DB migration: add unique index on users.name"
                        Push-Location "$(Pipeline.Workspace)\drop-back"
                        try {
                          npm run migrate:add-unique-name
                        } finally {
                          Pop-Location
                        }
                      } else {
                        Write-Host "Skipping DB migrations (RUN_DB_MIGRATIONS != true)"
                      }

                #- script: |
                    #cd "$(Pipeline.Workspace)/drop-front"
                    #echo "📂 Contenido de drop-front:"
                    #dir
                  #displayName: "Debug - Revisar contenido del frontend"

                - script: |
                    echo "REACT_APP_API_URL=https://tp05-backend-qa-chdtg5exgzarc7hd.brazilsouth-01.azurewebsites.net" > .env
                  displayName: "Configurar API URL para QA"
                
                #- script: set
                 # displayName: "Debug - Listar variables de entorno"

                #- script: |
                   # echo 🔎 Verificando tokens disponibles...
                   # echo "SWA_TOKEN_QA = $(SWA_TOKEN_QA)"
                    #echo "SWA_TOKEN_PROD = $(SWA_TOKEN_PROD)"
                  #displayName: "Check SWA tokens"

                # Frontend QA
                - script: |
                    cd "$(Pipeline.Workspace)/drop-front"
                    npm install -g @azure/static-web-apps-cli
                    npx swa deploy ./ --app-location . --deployment-token $(SWA_TOKEN_QA)
                  displayName: "Deploy Frontend QA"

                - task: PowerShell@2
                  displayName: "Run smoke tests against QA"
                  inputs:
                    targetType: 'filePath'
                    filePath: '$(Build.SourcesDirectory)\\smoke_qa.ps1'
                    arguments: ''

                #- script: |
                   # echo "📂 Archivos que quedaron en drop-front:"
                   # dir "$(Pipeline.Workspace)/drop-front"

                    #echo "🔎 Probando acceso a index.html:"
                    #if exist "$(Pipeline.Workspace)/drop-front\index.html" (
                     # echo "✅ index.html encontrado"
                   # ) else (
                   #   echo "❌ index.html NO encontrado"
                  #  )
                  #displayName: "Debug - Verificar contenido desplegado QA"
                  #condition: always()

# -------------------------------
# Deploy PROD
# -------------------------------
  - stage: Deploy_PROD
    displayName: "Deploy to Production"
    dependsOn: Deploy_QA
    jobs:
      - deployment: DeployPROD
        displayName: "Desplegar PROD"
        environment: "PROD"
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop-front
                - download: current
                  artifact: drop-back

                - task: ArchiveFiles@2
                  displayName: "Empaquetar Backend (PROD)"
                  inputs:
                    rootFolderOrFile: '$(Pipeline.Workspace)/drop-back'
                    includeRootFolder: false
                    archiveFile: '$(Pipeline.Workspace)/drop-back.zip'
                    replaceExistingArchive: true

                # Backend PROD
                - task: AzureWebApp@1
                  displayName: "Deploy Backend PROD"
                  inputs:
                    azureSubscription: "azure-connection-tp06"
                    appName: "tp05-backend-prod"
                    package: "$(Pipeline.Workspace)/drop-back.zip"
                
                - script: |
                    echo "REACT_APP_API_URL=https://tp05-backend-prod-cudvdwd9c0exdbhc.brazilsouth-01.azurewebsites.net" > .env
                  displayName: "Configurar API URL para PROD"

                # Frontend PROD
                - script: |
                    cd "$(Pipeline.Workspace)/drop-front"
                    npm install -g @azure/static-web-apps-cli
                    npx swa deploy ./ --app-location . --deployment-token $(SWA_TOKEN_PROD) --env prod
                  displayName: "Deploy Frontend PROD"




