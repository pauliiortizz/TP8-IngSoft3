trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - '*'

variables:
- group: BackendSecrets

pool:
  name: Pauli

stages:
# =======================================
# 🧱 BUILD & TEST
# =======================================
- stage: BuildAndTest
  displayName: "Build & Test Backend + Frontend"
  jobs:
    - job: BuildAndTest
      steps:
        - checkout: self

        # ---- Backend (.NET 8) ----
        - task: UseDotNet@2
          displayName: "Setup .NET 8 SDK"
          inputs:
            packageType: sdk
            version: "8.0.x"

        - script: dotnet restore Backend/ProductApi.sln
          displayName: "Restore .NET Dependencies"

        - script: dotnet build Backend/ProductApi.sln --configuration Release --no-restore
          displayName: "Build .NET Project"

        - script: >
            dotnet test Backend.Tests/EmployeeCrudApi.Tests.csproj
            --logger "trx;LogFileName=dotnet-tests.trx"
            --results-directory "$(Build.SourcesDirectory)/test-results"
          displayName: "Run .NET Unit Tests"

        - task: PublishTestResults@2
          displayName: "Publish .NET Test Results"
          inputs:
            testResultsFormat: "VSTest"
            testResultsFiles: "test-results/*.trx"
            mergeTestResults: true
            failTaskOnFailedTests: true

        # ---- Frontend (Angular) ----
        - task: NodeTool@0
          displayName: "Setup Node.js 20"
          inputs:
            versionSpec: "20.x"

        - script: npm ci
          displayName: "Install Angular Dependencies"
          workingDirectory: Frontend

        - script: |
            echo "🚀 Running Angular Unit Tests..."
            npx ng test --browsers=ChromeHeadless --watch=false --no-progress --code-coverage
          displayName: "Run Angular Tests"
          workingDirectory: Frontend

        - task: PublishTestResults@2
          displayName: "Publish Angular Test Results"
          inputs:
            testResultsFormat: "JUnit"
            testResultsFiles: "Frontend/test-results/*.xml"
            mergeTestResults: true
            failTaskOnFailedTests: true

        # ---- Build Angular y copiar al backend (portable) ----
        - script: |
            echo "🏗️ Building Angular..."
            npm ci
            npm run build -- --configuration production
          displayName: "Build Angular"
          workingDirectory: Frontend

        - task: CopyFiles@2
          displayName: "Copy Angular dist to backend wwwroot"
          inputs:
            # If Angular build produces a 'browser' subfolder (SSR), copy from there so index.html lands at wwwroot root
            SourceFolder: 'Frontend/dist/employee-crud-angular/browser'
            Contents: '**'
            TargetFolder: 'Backend/Backend/wwwroot'

        - script: |
            echo "Listado Backend/Backend/wwwroot (post-copy):"
            dir Backend\Backend\wwwroot
          displayName: "List wwwroot (debug)"


        # ---- Publish backend+frontend juntos ----
        - script: >
            dotnet publish Backend/Backend/ProductosApi.csproj -c Release -o "$(Build.ArtifactStagingDirectory)/publish"
          displayName: "Publish Backend+Frontend"

        - task: PublishBuildArtifacts@1
          displayName: "Publish Build Artifact"
          inputs:
            PathtoPublish: "$(Build.ArtifactStagingDirectory)/publish"
            ArtifactName: "drop"

# =======================================
# 🌐 DEPLOY QA
# =======================================
- stage: Deploy_QA
  displayName: "Deploy to QA"
  dependsOn: BuildAndTest
  variables:
    WEBAPP_QA: ProductosWEB
  jobs:
    - deployment: DeployQA
      displayName: "Desplegar QA"
      environment: "QA"
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - download: current
                artifact: drop

              - task: AzureAppServiceSettings@1
                displayName: "Set App Settings QA"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_QA)"
                  resourceGroupName: "$(RG_QA)"
                  appSettings: |
                    [
                      { "name": "ConnectionStrings__MongoDb", "value": "$(MONGO_CONNSTR_QA)" },
                      { "name": "ASPNETCORE_ENVIRONMENT", "value": "QA" }
                    ]

              - task: AzureWebApp@1
                displayName: "Deploy Backend+Frontend QA"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_QA)"
                  package: "$(Pipeline.Workspace)/drop"

              - pwsh: |
                  Write-Host "🔍 Checking health of QA..."
                  try {
                    $response = Invoke-WebRequest -Uri "https://$(WEBAPP_QA).azurewebsites.net/health" -UseBasicParsing -TimeoutSec 15
                    if ($response.StatusCode -ne 200) {
                      throw "❌ Health check failed with status $($response.StatusCode)"
                    }
                    Write-Host "✅ Health check OK!"
                  } catch {
                    Write-Error "❌ Health check failed: $_"
                    exit 1
                  }
                displayName: "Health Check QA"

# =======================================
# 🚀 DEPLOY PROD
# =======================================
- stage: Deploy_PROD
  displayName: "Deploy to Production"
  variables:
    WEBAPP_PROD: ProductosWEB-PROD
  jobs:
    - deployment: DeployPROD
      displayName: "Desplegar PROD"
      environment: "PROD"
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - download: current
                artifact: drop

              - task: AzureAppServiceSettings@1
                displayName: "Set App Settings PROD"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_PROD)"
                  resourceGroupName: "$(RG_PROD)"
                  appSettings: |
                    [
                      { "name": "ConnectionStrings__MongoDb", "value": "$(MONGO_CONNSTR_PROD)" },
                      { "name": "ASPNETCORE_ENVIRONMENT", "value": "Production" }
                    ]

              - task: AzureWebApp@1
                displayName: "Deploy Backend+Frontend PROD"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_PROD)"
                  package: "$(Pipeline.Workspace)/drop"

              - pwsh: |
                  Write-Host "🔍 Checking health of PROD..."
                  try {
                    $response = Invoke-WebRequest -Uri "https://$(WEBAPP_PROD).azurewebsites.net/health"
                    if ($response.StatusCode -ne 200) {
                      throw "❌ Health check failed with status $($response.StatusCode)"
                    }
                    Write-Host "✅ Health check OK!"
                  } catch {
                    Write-Error "❌ Health check failed: $_"
                    exit 1
                  }
                displayName: "Health Check PROD"