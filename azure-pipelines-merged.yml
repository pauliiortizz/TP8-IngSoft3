trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - '*'

variables:
- group: BackendSecrets

pool:
  name: Pauli

stages:
# =======================================
# 🧱 BUILD & TEST
# =======================================
- stage: BuildAndTest
  displayName: "Build & Test Backend + Frontend"
  jobs:
    - job: BuildAndTest
      steps:
        - checkout: self

        # ---- Backend (.NET 8) ----
        - task: UseDotNet@2
          displayName: "Setup .NET 8 SDK"
          inputs:
            packageType: sdk
            version: "8.0.x"

        - script: dotnet restore Backend/ProductApi.sln
          displayName: "Restore .NET Dependencies"

        - script: dotnet build Backend/ProductApi.sln --configuration Release --no-restore
          displayName: "Build .NET Project"

        - script: >
            dotnet test Backend.Tests/EmployeeCrudApi.Tests.csproj
            --logger "trx;LogFileName=dotnet-tests.trx"
            --results-directory "$(Build.SourcesDirectory)/test-results"
          displayName: "Run .NET Unit Tests"

        - task: PublishTestResults@2
          displayName: "Publish .NET Test Results"
          inputs:
            testResultsFormat: "VSTest"
            testResultsFiles: "test-results/*.trx"
            mergeTestResults: true
            failTaskOnFailedTests: true

        # ---- Frontend (Angular) ----
        - task: NodeTool@0
          displayName: "Setup Node.js 20"
          inputs:
            versionSpec: "20.x"

        - script: npm ci
          displayName: "Install Angular Dependencies"
          workingDirectory: Frontend

        - script: |
            echo "🚀 Running Angular Unit Tests..."
            npx ng test --browsers=ChromeHeadless --watch=false --no-progress --code-coverage
          displayName: "Run Angular Tests"
          workingDirectory: Frontend

        - task: PublishTestResults@2
          displayName: "Publish Angular Test Results"
          inputs:
            testResultsFormat: "JUnit"
            testResultsFiles: "Frontend/test-results/*.xml"
            mergeTestResults: true
            failTaskOnFailedTests: true

        # ---- Build Angular y copiar al backend ----
        - script: |
            echo "🏗️ Building Angular and copying to backend..."
            npm run build --prefix Frontend -- --configuration production
            if not exist Backend\Backend\wwwroot mkdir Backend\Backend\wwwroot
            xcopy Frontend\dist\* Backend\Backend\wwwroot /E /I /Y
          displayName: "Build Angular and copy to backend"

        # ---- Publish backend+frontend juntos ----
        - script: >
            dotnet publish Backend/Backend/ProductosApi.csproj
            -c Release -o "$(Build.ArtifactStagingDirectory)/publish"
          displayName: "Publish Backend+Frontend"

        - task: PublishBuildArtifacts@1
          displayName: "Publish Build Artifact"
          inputs:
            PathtoPublish: "$(Build.ArtifactStagingDirectory)/publish"
            ArtifactName: "drop"

# =======================================
# 🌐 DEPLOY QA
# =======================================
- stage: Deploy_QA
  displayName: "Deploy to QA"
  dependsOn: BuildAndTest
  variables:
    WEBAPP_QA: productosweb-fpcnfsbsg8gscbat.brazilsouth-01
  jobs:
    - deployment: DeployQA
      displayName: "Desplegar QA"
      environment: "QA"
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - download: current
                artifact: drop

              - task: AzureAppServiceSettings@1
                displayName: "Set App Settings QA"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_QA)"
                  resourceGroupName: "$(RG_QA)"
                  appSettings: |
                    [
                      { "name": "ConnectionStrings__MongoDb", "value": "$(MONGO_CONNSTR_QA)" },
                      { "name": "ASPNETCORE_ENVIRONMENT", "value": "QA" }
                    ]

              - task: AzureWebApp@1
                displayName: "Deploy Backend+Frontend QA"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_QA)"
                  package: "$(Pipeline.Workspace)/drop"

              - task: InvokeRESTAPI@1
                displayName: "Health Check QA"
                inputs:
                  connectionType: 'connectedServiceName'
                  serviceConnection: 'azure-connection-tp06'
                  method: 'GET'
                  urlSuffix: 'https://$(WEBAPP_QA).azurewebsites.net/health'
                  successCriteria: 'eq(root["statusCode"],200)'

# =======================================
# 🚀 DEPLOY PROD
# =======================================
- stage: Deploy_PROD
  displayName: "Deploy to Production"
  dependsOn: Approve_PROD
  variables:
    WEBAPP_PROD: productosweb-prod-gbfnaef6a3c7e3e7.brazilsouth-01
  jobs:
    - deployment: DeployPROD
      displayName: "Desplegar PROD"
      environment: "PROD"
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - download: current
                artifact: drop

              - script: |
                  echo Setting App Settings PROD...
                  az webapp config appsettings set ^
                  --name $(WEBAPP_PROD) ^
                  --resource-group $(RG_PROD) ^
                  --settings ConnectionStrings__MongoDb="$(MONGO_CONNSTR_PROD)" ^
                             ASPNETCORE_ENVIRONMENT="Production"
                  displayName: "Set App Settings PROD"
                  shell: cmd

              - task: AzureWebApp@1
                displayName: "Deploy Backend+Frontend PROD"
                inputs:
                  azureSubscription: "azure-connection-tp06"
                  appName: "$(WEBAPP_PROD)"
                  package: "$(Pipeline.Workspace)/drop"

              - script: |
                  echo "🔍 Checking health of PROD..."
                  curl -f https://$(WEBAPP_PROD).azurewebsites.net/health || exit 1
                displayName: "Health Check PROD"